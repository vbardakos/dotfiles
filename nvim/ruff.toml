
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "pyi",
]

# Same as Black.
line-length = 88
indent-width = 4

[lint]
ignore = ["D"]
select = [
  "F",
  "E",
  "W",
  "C",
  "I",
  "N",
  "D",
  "U",
  "ASYNC",
  "S",
  "B",
  "A",
  "C4",
  "DTZ",
  "EM",
  "EXE",
  "FA",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "PYI",
  "PT",
  "Q",
  "RET",
  "SIM",
  "TID",
  "TC",
  "ARG",
  "PTH",
  "FIX",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "NPY",
  "FAST",
  "AIR",
  "PERF",
  "FURB",
  "RUF"
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
