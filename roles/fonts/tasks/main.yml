---
- name: "[{{ role_name }}] Checking for Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: distribution_config

- name: "[{{ role_name }}] Run Tasks: {{ ansible_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: distribution_config.stat.exists

- name: "[{{ role_name }}] Find TTF files {{ ansible_distribution }}"
  find:
    paths: "{{ role_path }}/sources/fonts"
    patterns: "*.ttf"
    recurse: false
  register: ttf_fonts

- name: "[{{ role_name }}] Link TTF files {{ ansible_distribution }}"
  file:
    src: "{{ item.path }}"
    dest: "{{ dest_dir }}/{{ item.path | basename }}"
    state: link
  with_items: "{{ ttf_fonts.files }}"
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: "[{{ role_name }}] Rebuild Font Cache {{ ansible_distribution }}"
  command: fc-cache -f -v
  when: ansible_facts['os_family'] == 'Debian'
  become: true
  changed_when: false
